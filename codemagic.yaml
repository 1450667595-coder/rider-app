workflows:
  android-build:
    name: Android Build
    max_build_duration: 20
    environment:
      node: 22.0.0
      java: 17
      vars:
        PACKAGE_NAME: "com.meituan.rider"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Fix Java 17 compatibility
        script: |
          find . -name "*.gradle" -path "*/capacitor*" -exec sed -i '' 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_17/g' {} \;
          find . -name "*.gradle" -path "*capacitor*" -exec sed -i '' 's/JavaVersion\.VERSION_22/JavaVersion.VERSION_17/g' {} \;
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk