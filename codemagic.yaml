workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    environment:
      node: 20.0.0
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcodebuild build -workspace ios/App/${XCODE_WORKSPACE} \
            -scheme ${XCODE_SCHEME} \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - your-email@example.com