workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    environment:
      node: 22.0.0
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build IPA
        script: |
          cd ios/App
          xcodebuild build \
            -project ${XCODE_PROJECT} \
            -scheme ${XCODE_SCHEME} \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
    artifacts:
      - $CM_BUILD_DIR/App.xcarchive