workflows:
  android-build:
    name: Android Build
    max_build_duration: 20
    environment:
      node: 22.0.0
      java: 17
      vars:
        PACKAGE_NAME: "com.meituan.rider"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Fix Java version
        script: |
          java -version
          echo "=== Files with VERSION_2[12] ==="
          grep -rl "VERSION_2[12]" android/ node_modules/@capacitor/ 2>/dev/null
          echo "=== Replacing ==="
          grep -rl "VERSION_2[12]" android/ node_modules/@capacitor/ 2>/dev/null | while read f; do
            echo "Fixing: $f"
            perl -pi -e 's/JavaVersion\.VERSION_2[12]/JavaVersion.VERSION_17/g' "$f"
          done
          echo "=== After fix ==="
          grep -r "VERSION_2[12]" android/ node_modules/@capacitor/ 2>/dev/null || echo "All VERSION_21/22 replaced!"
      - name: Build APK
        script: |
          java -version
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk