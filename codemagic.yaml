workflows:
  android-build:
    name: Android Build
    max_build_duration: 20
    environment:
      node: 22.0.0
      java: 17
      vars:
        PACKAGE_NAME: "com.meituan.rider"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Fix Java 17 compatibility
        script: |
          echo "=== Before fix ==="
          grep -r "VERSION_2[12]" android/app/capacitor.build.gradle node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || echo "no match"
          sed -i '' 's/VERSION_21/VERSION_17/g' android/app/capacitor.build.gradle
          sed -i '' 's/VERSION_21/VERSION_17/g' node_modules/@capacitor/android/capacitor/build.gradle
          sed -i '' 's/VERSION_22/VERSION_17/g' android/app/capacitor.build.gradle
          sed -i '' 's/VERSION_22/VERSION_17/g' node_modules/@capacitor/android/capacitor/build.gradle
          echo "=== After fix ==="
          grep -r "VERSION_" android/app/capacitor.build.gradle node_modules/@capacitor/android/capacitor/build.gradle 2>/dev/null || echo "no match"
      - name: Build APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk