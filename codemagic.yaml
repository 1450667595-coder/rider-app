workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    environment:
      node: 22.0.0
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        APPLE_ID: "1450667595@qq.com"
        APPLE_PASSWORD: "yvko-rood-rlqt-pnmq"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build app
        script: |
          cd ios/App
          security add-generic-password -a "${APPLE_ID}" -s "Xcode" -w "${APPLE_PASSWORD}" -T /usr/bin/security -T /usr/bin/xcodebuild -U 2>/dev/null || true
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          xcodebuild build \
            -project ${XCODE_PROJECT} \
            -scheme ${XCODE_SCHEME} \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -allowProvisioningDeviceRegistration \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Package IPA
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -1)
          cd $(dirname "$APP_PATH")
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload/
          echo "IPA generated at: $(pwd)/App.ipa"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/App.ipa