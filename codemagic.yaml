workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 30
    environment:
      node: 22.0.0
      xcode: 16.0
      cocoapods: default
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build app
        script: |
          cd ios/App
          xcodebuild build \
            -project ${XCODE_PROJECT} \
            -scheme ${XCODE_SCHEME} \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Package IPA
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "App.app" -path "*/Release-iphoneos/*" | head -1)
          cd $(dirname "$APP_PATH")
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r App.ipa Payload/
          echo "IPA generated at: $(pwd)/App.ipa"
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Release-iphoneos/App.ipa